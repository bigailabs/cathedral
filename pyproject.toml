[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cathedral-scaffold"
version = "4.0.0-rc.4"
description = "Cathedral SN39 mechanism, publisher, and research code"
requires-python = ">=3.11"
# Shared mechanism dependencies. The supported validator distribution and its
# operator dependency lock live in cathedralai/cathedral-validator.
dependencies = [
    "cryptography>=42",
    "bittensor>=10.4,<11",
    "numpy>=1.24",
]

[project.optional-dependencies]
publisher = [
    "fastapi>=0.115",
    "httpx2>=2",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "bittensor-wallet>=4.1.0",
    "blake3>=1.0",
    "psycopg2-binary>=2.9",
    "boto3>=1.35",
]
test = [
    "pytest>=8",
    # Ruff 0.16 expands the default rule set against the pre-existing thin
    # subnet tree. Keep required CI reproducible at the reviewed baseline until
    # that separate migration is performed deliberately.
    "ruff==0.15.13",
]
# Legacy provenance integration used by retained mechanism and migration tests.
# The canonical validator owns its reviewed pin and release process.
# Pinned to the immutable launch-candidate commit; update ONLY together
# with the reviewed release process (never a mutable branch ref).
provenance = [
    "cathedral @ https://github.com/cathedralai/cathedral-compute/archive/655c264421a1f5f2e625a372a40f595aa1e114ab.tar.gz#sha256=2384833be9ece20d4946aecd0b499eaee0e292994d1275a54d1d52c029836a9b",
]

[project.scripts]
cathedral-candidate-snapshot = "scaffold.snapshot_candidates:main"
cathedral-game = "game.__main__:main"
cathedral-arena = "game.arena.__main__:main"
cathedral-arena-audit = "game.arena.audit:main"
cathedral-arena-serve = "game.arena.serve:main"
cathedral-arena-verify = "game.arena.bundle:main"
cathedral-arena-playthrough = "game.arena.playthrough:main"
cathedral-arena-round-verify = "game.arena.verify:main"
cathedral-audit-scanner-smoke = "game.arena.audit_scanner_smoke:main"
cathedral-thin-miner = "cathedral_thin.miner:main"
cathedral-thin-e2e = "cathedral_thin.e2e:main"
cathedral-thin-preflight = "cathedral_thin.preflight:main"
cathedral-thin-score-report = "cathedral_thin.report_cli:main"
cathedral-thin-contributor = "cathedral_thin.contributor_cli:main"
cathedral-verifyml = "cathedral_thin.verifyml_cli:main"
cathedral-verified-policy = "cathedral_thin.policy_cli:main"

[tool.setuptools.packages.find]
include = ["scaffold*", "game*", "cathedral_thin*"]
exclude = ["game.tests*", "game.arena.tests*"]
