# Railway reads service config from the repository root. Keep this in sync with
# deploy/railway.toml so CLI uploads and GitHub deploys use the hardened image.

[build]
builder = "dockerfile"
dockerfilePath = "deploy/Dockerfile"

[deploy]
healthcheckPath = "/health/live"
healthcheckTimeout = 10
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Production uses Postgres via DATABASE_URL. Multiple read/submit replicas are
# allowed, but durable background jobs must stay role-gated and advisory-locked.
numReplicas = 4
