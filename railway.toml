# Railway reads service config from the repository root. Keep this in sync with
# deploy/railway.toml so CLI uploads and GitHub deploys use the hardened image.

[build]
builder = "dockerfile"
dockerfilePath = "deploy/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
numReplicas = 1
