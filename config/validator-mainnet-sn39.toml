# Cathedral SN39 mainnet launch configuration.
#
# Default authority is THIN: verify Cathedral's signed vector and submit it.
# The provenance verifier runs concurrently in shadow mode and never delays
# the thin submission. It reports FULL only when the operator supplies the
# controlled raw-evidence package; public receipts alone remain
# receipts_only. See docs/SN39_MAINNET_RELEASE_20260724.md for the exact
# release boundary and controlled-disclosure procedure.

[network]
name = "finney"
netuid = 39
wallet_name = "validator"
validator_hotkey = "default"

[publisher]
url = "https://api.cathedral.computer"

[weight_policy]
public_key_hex = "10890a66aa752479cb3b634f366d7bd27c374324d83f88d2d6b69ab066f25e26" # pragma: allowlist secret
key_id = "cathedral-weight-policy"
require_policy = "validated_supply_v1"
state_file = "/var/lib/cathedral-validator/thin-state.json"

[weights]
interval_secs = 1500
# SN39 recurring operation never treats zero as unlimited authority. A
# separate root-signed authorization supplies the mandatory per-authorization
# attempt ceiling (at most 96), rollback-resistant account-nonce range, and
# expiry window.
max_submissions = 0

[runtime]
# Thin and FULL-authority processes must use this same owner-only directory.
# The service install creates it mode 0700 for the validator account.
root = "/var/lib/cathedral-validator"

[provenance]
mode = "shadow"
evidence_url = "https://api.cathedral.computer/v1/evidence"
registry_keys = "config/provenance/registry-keys.json"
registry_keys_digest = "sha256:5fb8f00cd2541606927373f596c2ba77d4ce485df0539f4afd5091858af48512"
report_keys = "config/provenance/report-keys.json"
report_keys_digest = "sha256:30e438fff5b0508402b233eb5eec590a834882801a552edbbf7e62e45cf98c70"
index_keys = "config/provenance/index-keys.json"
index_keys_digest = "sha256:1e35b9ce36b3da3362a88feb93dfa90f1fe03ab7c42e902b13ac3789324f7611"
verifier_digest = "sha256:8292b085e4dbe228f8ffd2ec7046a1c0f1324ff5e7a29d1574ce16963f9b098f"
source_revision = "655c264421a1f5f2e625a372a40f595aa1e114ab" # pragma: allowlist secret
mechanism = "validated_supply_v1"
burn_hotkey = "5G3qVaXzKMPDm5AJ3dpzbpUC27kpccBvDwzSWXrq8M6qMmbC" # pragma: allowlist secret
controlled_dir = "/etc/cathedral/controlled/sn39-launch"
verifier_binary = "/opt/cathedral-sn39/bin/cathedral-tdx-verifier"

[launch]
# Continuous operation keeps the full audit concurrent and non-blocking.
# The one-shot launch service uses validator-mainnet-sn39-launch.toml instead.
require_full_provenance_for_broadcast = false
# This proves the one-shot launch but does not grant recurring write authority.
# The separately signed /etc/cathedral/sn39-recurring-write-authorization.json
# is also required before every reservation.
require_completed_launch_for_broadcast = true

[logs]
jsonl = "/var/log/cathedral-validator/validator-events.jsonl"
