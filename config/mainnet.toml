[network]
name = "finney"
netuid = 39
validator_hotkey = "REPLACE_ME"
wallet_name = "cathedral-validator"

[polaris]
base_url = "https://api.polaris.computer/"
public_key_hex = "REPLACE_WITH_POLARIS_ED25519_PUBLIC_KEY_HEX"
fetch_timeout_secs = 30

[http]
listen_host = "0.0.0.0"
listen_port = 9333
bearer_token_env = "CATHEDRAL_BEARER"

[weights]
# SN39 weights_rate_limit is 100 blocks * 12s = 1200s exactly. Firing at
# 1200s means every other set_weights races the rate-limit window and
# half land as blocked_by_transaction_error. 1500s (125 blocks) gives a
# clean 25-block buffer so every call succeeds.
interval_secs = 1500
disabled = false
# SN39 mainnet: uid 204 is the subnet owner. Burn target for the protective
# emission reserve until the SAT lane produces stable per-miner separation.
# Route 85% of weight to the subnet owner and reserve 15% for measured miner
# signal while the challenge engine and solver market harden.
burn_uid = 204
# WARNING: this value is rewritten on startup by _sync_sn39_mainnet_weight_policy
# in src/cathedral/config.py when network=finney AND netuid=39. Edits here are
# clobbered on next start unless you also change the MAINNET_FORCED_BURN_PERCENTAGE
# constant in src/cathedral/config.py. See AGENTS.md "Footgun list" for context.
forced_burn_percentage = 85.0
# Off until the bug_isolation_v1 feed is intentionally enabled.
v3_bug_isolation_weight = 0.0
# Off until synthetic_boolean_v1 is intentionally enabled.
task_family_weights = { synthetic_boolean_v1 = 0.0 }

[publisher]
url = "https://api.cathedral.computer"
public_key_env = "CATHEDRAL_PUBLIC_KEY_HEX"
pull_interval_secs = 30.0
api_token_env = "CATHEDRAL_PUBLISHER_TOKEN"

[remote_weight_source]
enabled = false
url = "https://api.cathedral.computer"
key_id = "cathedral-weight-policy"
public_key_env = "CATHEDRAL_WEIGHT_POLICY_PUBLIC_KEY_HEX"
poll_interval_secs = 60.0
request_timeout_secs = 10.0

[storage]
database_path = "/var/lib/cathedral/validator-mainnet.db"

[worker]
poll_interval_secs = 5.0
max_concurrent_verifications = 4

[stall]
after_secs = 600
