[package]
name = "m2-fixed-emission"
version = "0.1.0"
edition = "2021"

[dependencies]
# substrate-fixed is the EXACT crate subtensor uses for I64F64 money math.
# NOTE: the modern `fixed` 1.31 crate does NOT compile under Kani's nightly
# (uses unstable const `unchecked_shr`); substrate-fixed pins an older `fixed`
# 0.5.x core that is Kani-compatible. This is the faithful + working choice.
substrate-fixed = "0.5.9"

[profile.dev]
overflow-checks = true
