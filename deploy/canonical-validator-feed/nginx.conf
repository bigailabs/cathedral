# Cathedral SN39 canonical validator control plane.
#
# The signed scorer remains bound to 127.0.0.1. Nginx exposes only the public,
# read-only feed, its verification keys, and liveness. Install as
# /etc/nginx/sites-available/cathedral-validator-canonical after provisioning a
# certificate for api.cathedral.computer and read.cathedral.computer.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.cathedral.computer read.cathedral.computer;

    ssl_certificate /etc/letsencrypt/live/api.cathedral.computer/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.cathedral.computer/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:cathedral_validator_tls:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/cathedral-validator-canonical.access.log combined;
    error_log /var/log/nginx/cathedral-validator-canonical.error.log warn;

    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/cathedral/tls/scorer-canary-ca.crt;
    proxy_ssl_verify_depth 2;
    proxy_set_header Host 127.0.0.1;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;

    location = /v1/validator/weights/next {
        limit_except GET { deny all; }
        proxy_pass https://127.0.0.1:8012/v1/validator/weights/next;
        add_header Cache-Control "no-store" always;
    }

    location = /api/cathedral/v1/validator/weights/next {
        limit_except GET { deny all; }
        proxy_pass https://127.0.0.1:8012/v1/validator/weights/next;
        add_header Cache-Control "no-store" always;
    }

    location = /.well-known/cathedral-jwks.json {
        limit_except GET { deny all; }
        proxy_pass https://127.0.0.1:8012/.well-known/cathedral-jwks.json;
        add_header Cache-Control "public, max-age=60" always;
    }

    location = /health {
        limit_except GET { deny all; }
        proxy_pass https://127.0.0.1:8012/health;
        add_header Cache-Control "no-store" always;
    }

    location = /health/live {
        limit_except GET { deny all; }
        proxy_pass https://127.0.0.1:8012/health/live;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}
