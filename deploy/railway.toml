# Railway service config for the Cathedral v4 thin publisher.
# Deploy from the repo root; the Dockerfile lives in deploy/.

[build]
builder = "dockerfile"
dockerfilePath = "deploy/Dockerfile"

[deploy]
# Health gate: Railway holds traffic on the new deploy until /health/live is 200, so
# the same-URL swap only cuts over once the thin publisher is actually serving.
healthcheckPath = "/health/live"
healthcheckTimeout = 180

# Roll back automatically if the new deploy never goes healthy.
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Production uses Postgres via DATABASE_URL. Multiple read/submit replicas are
# allowed, but durable background jobs must stay role-gated and advisory-locked.
numReplicas = 2
