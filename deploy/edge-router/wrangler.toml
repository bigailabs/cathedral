name = "cathedral-edge-router"
main = "worker.mjs"
compatibility_date = "2026-06-25"
workers_dev = true
preview_urls = true

# Exact hot-path routes only. Do not use api.cathedral.computer/* or
# /v1/synthetic-boolean/* until every monolith endpoint is explicitly classified.
routes = [
  { pattern = "api.cathedral.computer/health*", zone_name = "cathedral.computer" },
  { pattern = "api.cathedral.computer/.well-known/cathedral-jwks.json", zone_name = "cathedral.computer" },

  { pattern = "api.cathedral.computer/v1/synthetic-boolean/active-challenges*", zone_name = "cathedral.computer" },
  { pattern = "api.cathedral.computer/v1/synthetic-boolean/challenge-broadcast*", zone_name = "cathedral.computer" },
  { pattern = "api.cathedral.computer/v1/synthetic-boolean/current-challenge*", zone_name = "cathedral.computer" },
  { pattern = "api.cathedral.computer/v1/synthetic-boolean/active-cnf*", zone_name = "cathedral.computer" },
  { pattern = "api.cathedral.computer/v1/synthetic-boolean/per-miner/challenges*", zone_name = "cathedral.computer" },
  { pattern = "api.cathedral.computer/v1/synthetic-boolean/per-miner/cnf*", zone_name = "cathedral.computer" },
  { pattern = "api.cathedral.computer/v1/synthetic-boolean/per-miner/status*", zone_name = "cathedral.computer" },
  { pattern = "api.cathedral.computer/v1/synthetic-boolean/per-miner/summary*", zone_name = "cathedral.computer" },
  { pattern = "api.cathedral.computer/v1/challenges/*", zone_name = "cathedral.computer" },

  { pattern = "api.cathedral.computer/api/cathedral/v1/synthetic-boolean/active-challenges*", zone_name = "cathedral.computer" },
  { pattern = "api.cathedral.computer/api/cathedral/v1/synthetic-boolean/challenge-broadcast*", zone_name = "cathedral.computer" },
  { pattern = "api.cathedral.computer/api/cathedral/v1/synthetic-boolean/current-challenge*", zone_name = "cathedral.computer" },
  { pattern = "api.cathedral.computer/api/cathedral/v1/synthetic-boolean/active-cnf*", zone_name = "cathedral.computer" },
  { pattern = "api.cathedral.computer/api/cathedral/v1/synthetic-boolean/per-miner/challenges*", zone_name = "cathedral.computer" },
  { pattern = "api.cathedral.computer/api/cathedral/v1/synthetic-boolean/per-miner/cnf*", zone_name = "cathedral.computer" },
  { pattern = "api.cathedral.computer/api/cathedral/v1/synthetic-boolean/per-miner/status*", zone_name = "cathedral.computer" },
  { pattern = "api.cathedral.computer/api/cathedral/v1/synthetic-boolean/per-miner/summary*", zone_name = "cathedral.computer" },
  { pattern = "api.cathedral.computer/api/cathedral/v1/challenges/*", zone_name = "cathedral.computer" },

  { pattern = "api.cathedral.computer/v1/agents/submit*", zone_name = "cathedral.computer" },
  { pattern = "api.cathedral.computer/api/cathedral/v1/agents/submit*", zone_name = "cathedral.computer" },
  { pattern = "api.cathedral.computer/v1/leaderboard/recent*", zone_name = "cathedral.computer" },
  { pattern = "api.cathedral.computer/v1/leaderboard/top*", zone_name = "cathedral.computer" },
  { pattern = "api.cathedral.computer/v1/leaderboard/explain*", zone_name = "cathedral.computer" },
  { pattern = "api.cathedral.computer/api/cathedral/v1/leaderboard/recent*", zone_name = "cathedral.computer" },
  { pattern = "api.cathedral.computer/api/cathedral/v1/leaderboard/top*", zone_name = "cathedral.computer" },
  { pattern = "api.cathedral.computer/api/cathedral/v1/leaderboard/explain*", zone_name = "cathedral.computer" },
  { pattern = "api.cathedral.computer/v1/validator/weights/next*", zone_name = "cathedral.computer" },
  { pattern = "api.cathedral.computer/api/cathedral/v1/validator/weights/next*", zone_name = "cathedral.computer" },
]

[vars]
READ_ORIGIN = "https://read.cathedral.computer"
SUBMIT_ORIGIN = "https://submit.cathedral.computer"
READ_ORIGIN_TIMEOUT_MS = "10000"
READ_HEALTH_ORIGIN_TIMEOUT_MS = "9000"
