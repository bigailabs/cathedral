name: two-mode-provenance
# Required CI for the SN39 two-mode validator: collects the two-mode suites
# WITH the provenance extra installed, runs the unmocked static-ELF
# verifier-bytes authenticator matrix on Linux x86_64, and lints changed
# launch files. The provenance extra is pinned to the reviewed, public
# cathedralconfidential main commit; dependency resolution is a hard gate.
on:
  pull_request:
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read

jobs:
  two-mode:
    name: Two-mode provenance
    runs-on: ubuntu-latest   # x86_64: ELF authenticator runs UNMOCKED
    timeout-minutes: 20
    env:
      # Job-level env is evaluated before a runner exists, so runner.temp is
      # not a valid context here. GitHub-hosted Ubuntu runners are ephemeral;
      # keep the locked environment outside the pristine checkout in /tmp.
      SN39_VENV: /tmp/cathedral-sn39-reproduction
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - name: Build the hash-locked launch environment
        run: |
          python -m venv "$SN39_VENV"
          "$SN39_VENV/bin/python" -m pip install \
            --require-hashes -r requirements/sn39-build.lock
          "$SN39_VENV/bin/python" -m pip install \
            --no-build-isolation \
            --require-hashes -r requirements/sn39-reproduction.lock
          "$SN39_VENV/bin/python" - <<'PY'
          from pathlib import Path
          from scripts.build_sn39_release_manifest import verify_locked_environment
          verify_locked_environment(
              Path(__import__("os").environ["SN39_VENV"]),
              Path("requirements/sn39-reproduction.lock"),
              Path("requirements/sn39-build.lock"),
          )
          print("hash-locked launch environment PASS")
          PY
      - name: Ruff (launch files)
        run: |
          "$SN39_VENV/bin/ruff" check \
            scaffold/validator_thin.py \
            scaffold/provenance_audit.py \
            scaffold/events.py \
            scaffold/sn39_public_reproduction.py \
            scripts/assert_sn39_public_reproduction.py \
            scripts/build_sn39_release_manifest.py \
            scripts/finalize_sn39_public_release.py \
            scripts/publish_sn39_validator_status.py \
            scripts/run_sn39_public_reproduction.py \
            scaffold/publisher/tests/test_sn39_public_status.py \
            deploy/sn39/cathedral-sn39-release-launcher.py
          "$SN39_VENV/bin/ruff" check \
            scaffold/publisher/app.py \
            scaffold/publisher/weights.py \
            scaffold/publisher/tests/test_weight_vector_scope.py
          # Legacy writer tombstones are linted too. Their pre-existing broad
          # exception handling is compatibility debt, not a reason to leave
          # the SN39 guards outside required CI.
          "$SN39_VENV/bin/ruff" check --ignore BLE001,S110,PLW1510 \
            cathedral_thin/validator.py \
            scaffold/chain.py \
            scaffold/publisher/mechanism_weightset.py \
            scaffold/publisher/tests/test_legacy_chain_guard.py \
            scaffold/publisher/tests/test_mechanism_weightset.py \
            tests/thin/test_validator.py
          "$SN39_VENV/bin/ruff" format --check \
            scaffold/validator_thin.py \
            scaffold/provenance_audit.py \
            scaffold/events.py \
            scaffold/sn39_public_reproduction.py \
            scripts/assert_sn39_public_reproduction.py \
            scripts/build_sn39_release_manifest.py \
            scripts/finalize_sn39_public_release.py \
            scripts/publish_sn39_validator_status.py \
            scripts/run_sn39_public_reproduction.py \
            scaffold/publisher/tests/test_sn39_public_status.py \
            deploy/sn39/cathedral-sn39-release-launcher.py \
            cathedral_thin/validator.py \
            scaffold/chain.py \
            scaffold/publisher/mechanism_weightset.py \
            scaffold/publisher/tests/test_legacy_chain_guard.py \
            scaffold/publisher/tests/test_mechanism_weightset.py \
            tests/thin/test_validator.py
      - name: Validator launch suites (collection is REQUIRED, not skippable)
        # NOTE: exactly ONE -q with --collect-only. A second -q (-qq) makes
        # supported pytest print only a per-file count — no node ids — so
        # the grep gate would exit 1 before the suite ever ran.
        run: |
          "$SN39_VENV/bin/python" -m pytest \
            scaffold/publisher/tests/test_validator_two_mode.py \
            scaffold/publisher/tests/test_validator_thin_validated_supply.py \
            scaffold/publisher/tests/test_validator_lifecycle.py \
            --collect-only -q | grep -q test_full_path_positive_revoked_restored
          "$SN39_VENV/bin/python" -m pytest -q \
            scaffold/publisher/tests/test_validator_two_mode.py \
            scaffold/publisher/tests/test_validator_thin_validated_supply.py \
            scaffold/publisher/tests/test_validator_lifecycle.py \
            scaffold/publisher/tests/test_sn39_public_status.py \
            scaffold/publisher/tests/test_legacy_chain_guard.py \
            scaffold/publisher/tests/test_mechanism_weightset.py \
            scaffold/publisher/tests/test_weight_vector_scope.py \
            tests/thin/test_validator.py
      - name: Reproduction imports
        run: |
          "$SN39_VENV/bin/python" - <<'PY'
          import cathedral
          import scaffold.sn39_public_reproduction
          print("hash-locked reproduction imports PASS")
          PY
      - name: Unmocked static-ELF authenticator matrix (Linux x86_64)
        run: |
          "$SN39_VENV/bin/python" -m pytest -q \
            ../cathedralconfidential/tests/test_replay.py -k verifier_authentication \
            2>/dev/null || \
          "$SN39_VENV/bin/python" - <<'PY'
          # The authenticator tests live in the pinned cathedral package's
          # repo; when running from the subnet checkout alone, exercise the
          # installed package's authenticator directly, UNMOCKED.
          import hashlib, struct
          from cathedral.replay import ReplayError, authenticate_verifier_bytes
          from cathedral.verify import tdx_implementation_digest_from_bytes
          def elf(machine=62, elf_type=2, ptypes=(1,)):
              h = bytearray(64); h[:4] = b"\x7fELF"; h[4:7] = b"\x02\x01\x01"
              struct.pack_into("<HH", h, 16, elf_type, machine)
              struct.pack_into("<Q", h, 32, 64)
              struct.pack_into("<HH", h, 54, 56, len(ptypes))
              b = bytearray()
              for p in ptypes:
                  e = bytearray(56); struct.pack_into("<I", e, 0, p); b += e
              return bytes(h) + bytes(b)
          D = ("/opt/cathedral/bin/cathedral-tdx-verifier-ci",)
          good = elf()
          imp = tdx_implementation_digest_from_bytes(D, D, {D[0]: good})
          authenticate_verifier_bytes(
              good,
              expected_blob_digest="sha256:" + hashlib.sha256(good).hexdigest(),
              declared_command=D, declared_artifacts=D,
              expected_implementation_digest=imp,
          )
          for bad in (b"#!/bin/sh\necho x", elf(machine=183), elf(elf_type=3),
                      elf(ptypes=(1, 3)), elf(ptypes=(2,))):
              try:
                  tdx_implementation_digest_from_bytes(D, D, {D[0]: bad})
              except ValueError:
                  continue
              raise SystemExit("non-static/non-x86_64 bytes were blessed")
          print("unmocked ELF authenticator matrix PASS")
          PY
