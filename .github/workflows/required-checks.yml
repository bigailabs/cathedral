name: required-checks

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**
      - feature/**

permissions:
  contents: read
  security-events: write

jobs:
  thin-subnet:
    name: Thin subnet tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install thin runtime and tests
        run: python -m pip install ".[test]"
      - name: Run adversarial, recovery, and end-to-end tests
        run: |
          ruff check cathedral_loop.py cathedral_thin tests/thin
          ruff format --check cathedral_thin tests/thin
          python -m pytest -q tests/thin
          cathedral-thin-e2e

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@adfda868f108ac4222129de456ea554034a27db7 # v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@adfda868f108ac4222129de456ea554034a27db7 # v4

  analyze-python:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Compile tracked Python files
        run: |
          git ls-files '*.py' | xargs python -m py_compile

  edge-router:
    name: Edge Router
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Run offline Cloudflare Worker tests
        run: node deploy/edge-router/worker.test.mjs

  leak-guard:
    name: leak-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan for committed secrets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH |)PRIVATE KEY-----"),
              re.compile(r"AKIA[0-9A-Z]{16}"),
              re.compile(r"(?i)(?:polaris|openai|anthropic|aws|github|ghp)[-_]?(?:api[-_]?)?key\s*[:=]\s*['\"][^'\"<>{}\s]{20,}['\"]"),
              re.compile(r"(?i)(?:secret|token|password)\s*[:=]\s*['\"][A-Za-z0-9_./+=-]{40,}['\"]"),
          ]
          allow_fragments = (
              "<long-random-token>",
              "<approved-real-verifier-digest>",
              "<sha256-of-approved-verifier-command>",
              "5Dt7HZ7Zpw4DppPxFM7Ke3Cm7sDAWhsZXmM5ZAmE7dSVJbcQ",
          )
          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          findings = []
          for name in files:
              path = pathlib.Path(name)
              if path.suffix.lower() in {".png", ".jpg", ".jpeg", ".gif", ".ico", ".pdf"}:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for lineno, line in enumerate(text.splitlines(), 1):
                  if any(fragment in line for fragment in allow_fragments):
                      continue
                  if any(pattern.search(line) for pattern in patterns):
                      findings.append(f"{name}:{lineno}: possible secret")
          if findings:
              print("\n".join(findings))
              sys.exit(1)
          PY
